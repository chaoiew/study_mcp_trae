# Spring Boot 应用配置
spring:
  application:
    name: spring-ai-mcp-demo
  # STDIO 模式需要禁用 banner 和 web 应用
  main:
    banner-mode: off
    web-application-type: none
  ai:
    mcp:
      server:
        name: spring-ai-mcp-demo
        version: 1.0.0
        stdio: true  # 启用 STDIO 传输
        annotation-scanner:
          enabled: true  # 启用注解扫描

# 日志配置 - STDIO 模式需要禁用控制台日志输出
logging:
  pattern:
    console: ""
  level:
    org.springframework.ai.mcp: DEBUG
    com.example.mcp: DEBUG
  file:
    name: logs/mcp-server.log
